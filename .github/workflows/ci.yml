name: Build, Test & Release Awesome-OS Noctalia

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v0.1.0) to publish noctalia-linux-x64.tar.zst'
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (C++23 / Wayland / OpenGL ES)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build & Wayland dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf ccache zstd github-cli \
            wayland wayland-protocols \
            libglvnd freetype2 fontconfig noto-fonts \
            cairo pango harfbuzz \
            libxkbcommon glib2 \
            libsecret libsodium \
            sdbus-cpp libpipewire wireplumber polkit \
            pam curl libwebp libjxl libsndfile librsvg \
            libqalculate libxml2 \
            md4c tomlplusplus libical \
            nlohmann-json stb \
            jemalloc just clang

      - uses: actions/checkout@v4

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-noctalia-${{ github.sha }}
          restore-keys: ccache-noctalia-

      - name: Build Debug & Run C++23 Test Suite
        run: |
          just build debug
          just test debug --num-processes 1 --timeout-multiplier 2

      - name: Build Release & Package noctalia-linux-x64.tar.zst
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          just build release
          mkdir -p dist-release/noctalia
          cp build-release/noctalia build-release/noctalia-pam-helper dist-release/noctalia/
          chmod +x dist-release/noctalia/noctalia dist-release/noctalia/noctalia-pam-helper
          tar --zstd -cf dist-release/noctalia-linux-x64.tar.zst -C dist-release/noctalia .
          (cd dist-release && sha256sum noctalia-linux-x64.tar.zst > SHA256SUMS.txt)
          ls -lh dist-release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "${{ github.repository }}" dist-release/noctalia-linux-x64.tar.zst dist-release/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" -R "${{ github.repository }}" dist-release/noctalia-linux-x64.tar.zst dist-release/SHA256SUMS.txt \
              --title "Awesome-OS Noctalia ${TAG}" \
              --notes "Native C++23 Wayland + OpenGL ES desktop shell (zero Qt/GTK) for Awesome-OS & T2Desktop."
          fi

      - name: Save ccache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-noctalia-${{ github.sha }}
